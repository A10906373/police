		<item>
		<title>‘แบรนด์เข้าใจคนแบบฉันแค่ไหน?’ รู้จัก Inclusive Marketing และเหตุผลที่แบรนด์ควรเข้าใจ เมื่อทำตลาดกับ Gen Z</title>
		<link>https://www.marketingoops.com/how-to-4/inclusive-marketing-gen-z/</link>
		
		<dc:creator><![CDATA[Chonlatid Thongpaijid]]></dc:creator>
